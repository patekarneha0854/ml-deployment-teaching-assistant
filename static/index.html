<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teaching Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .response-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-left: 4px solid #007bff; border-radius: 4px; white-space: pre-wrap; }
        .loading { color: #666; font-style: italic; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Academic Teaching Assistant</h2>
    <textarea id="questionInput" placeholder="Ask your course question here..."></textarea>
    <button onclick="askAssistant()">Ask Assistant</button>
    <div id="loading" class="loading" style="display:none;">Thinking...</div>
    <div id="responseBox" class="response-box" style="display:none;"></div>
</div>

<script>
    async function askAssistant() {
        const question = document.getElementById("questionInput").value.trim();
        const responseBox = document.getElementById("responseBox");
        const loading = document.getElementById("loading");

        if (!question) {
            alert("Please enter a valid question.");
            return;
        }

        loading.style.display = "block";
        responseBox.style.display = "none";
        responseBox.textContent = "";

        try {
            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });

            const data = await res.json();
            if (res.ok) {
                responseBox.innerHTML = marked.parse(data.answer);
            } else {
                responseBox.textContent = "Error: " + (data.detail || "Something went wrong.");
            }
        } catch (err) {
            responseBox.textContent = "Network error: " + err.message;
        } finally {
            loading.style.display = "none";
            responseBox.style.display = "block";
        }
    }
</script>
</body>
</html>
